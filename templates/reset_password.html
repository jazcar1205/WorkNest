<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TacklNest — Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #F4F0EC;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .login-sidebar {
            width: 420px;
            background: #150700;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 52px;
            flex-shrink: 0;
        }

        .login-logo {
            font-family: 'Pacifico', cursive;
            color: #FFFFFF;
            font-size: 32px;
            margin-bottom: 16px;
        }

        .login-tagline {
            color: #8A6040;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 0;
        }

        .login-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #FFFFFF;
            border-radius: 16px;
            border: 1px solid #E4D8CC;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 48px 52px;
            width: 420px;
            max-width: 92vw;
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: #1C0A02;
            margin: 0 0 6px;
        }

        .card-sub {
            font-size: 13.5px;
            color: #8A7060;
            margin: 0 0 32px;
        }

        label {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            color: #8A7060;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="password"] {
            width: 100%;
            padding: 10px 13px;
            margin-bottom: 18px;
            border: 1px solid #E4D8CC;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            background: #FFFFFF;
            color: #1C0A02;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="password"]:focus {
            border-color: #C87941;
            box-shadow: 0 0 0 3px rgba(200,121,65,0.12);
        }

        .error-box {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: #991B1B;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 12px;
            background: #80461B;
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-submit:hover { background: #5a2f12; }

        .login-note {
            font-size: 12.5px;
            color: #B0968A;
            margin-top: 20px;
            text-align: center;
        }

        .login-note a {
            color: #80461B;
            text-decoration: none;
            font-weight: 600;
        }

        .login-note a:hover { text-decoration: underline; }
    </style>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GQJB1KQKF8"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GQJB1KQKF8');
</script>

<body>

<div class="login-sidebar">
    <div class="login-logo">TacklNest</div>
    <p class="login-tagline">Choose a new password for <strong style="color:#C87941">{{ username }}</strong>.</p>
</div>

<div class="login-main">
    <div class="login-card">
        <h1 class="card-title">Set New Password</h1>
        <p class="card-sub">Must be at least 6 characters</p>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/reset-password/{{ token }}">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" placeholder="Min. 6 characters" required autofocus>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>

            <button type="submit" class="btn-submit">Update Password</button>
        </form>

        <p class="login-note"><a href="/login">Back to Sign In</a></p>
    </div>
</div>

</body>
</html>
